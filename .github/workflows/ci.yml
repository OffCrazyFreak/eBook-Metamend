name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tool itself has no dependencies; ruff is a dev tool only.
      - name: Install dev tools
        run: pipx install ruff && pip install pytest

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest tests/ -q

      - name: Byte-compile (catches syntax errors on every supported version)
        run: python -m compileall -q .

      - name: Assert the tool stays dependency-free
        run: |
          python - <<'PY'
          import sys, glob, re
          third = set()
          for f in glob.glob("*.py"):
              for line in open(f):
                  m = re.match(r'^\s*(?:import|from)\s+([a-zA-Z_][\w.]*)', line)
                  if m:
                      mod = m.group(1).split('.')[0]
                      if mod not in sys.stdlib_module_names:
                          third.add(mod)
          if third:
              print("Third-party imports found:", sorted(third))
              sys.exit(1)
          print("stdlib only, as documented")
          PY
