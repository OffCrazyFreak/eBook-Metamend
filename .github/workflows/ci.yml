name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Editable install so the src/ layout is importable, exactly as a user
      # would have it. ruff and pytest are dev extras; the tool itself has no
      # runtime dependencies.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Assert the tool stays dependency-free
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          # Walk the package, not the repository root. The previous version of
          # this check globbed *.py at the top level, so once the code moved into
          # src/ it silently iterated zero files and passed regardless.
          package = pathlib.Path("src/ebook_metamend")
          files = sorted(package.rglob("*.py"))
          if not files:
              sys.exit("found no package source files to check")

          third_party = {}
          for path in files:
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      # A relative import is our own package.
                      if node.level:
                          continue
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      root = name.split(".")[0]
                      if root and root not in sys.stdlib_module_names and root != "ebook_metamend":
                          third_party.setdefault(root, []).append(str(path))

          if third_party:
              for module, where in sorted(third_party.items()):
                  print(f"third-party import {module!r} in {where[0]}")
              sys.exit("the tool must import only the standard library")
          print(f"stdlib only across {len(files)} files, as documented")
          PY

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build
