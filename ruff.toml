# Ruff configuration.
#
# The rule set is deliberately modest. This is a small tool, and the goal is to
# catch real mistakes (unused names, shadowed builtins, bad comprehensions), not
# to enforce a house style on top of the formatter.

target-version = "py310"
line-length = 100

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes: unused imports and names, undefined names
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "UP",  # pyupgrade: outdated syntax for the target version
  "B",   # bugbear: likely bugs
  "A",   # builtin shadowing
  "C4",  # comprehension simplifications
]

ignore = [
  "E501",  # line length is handled by the formatter
  "E741",  # short loop variables like `l` are fine in this codebase
]

[format]
quote-style = "preserve"
