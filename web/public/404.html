<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#001a46" />
    <meta name="robots" content="noindex" />
    <title>No such sheet · eBook Metamend</title>
    <link rel="icon" href="/eBook-Metamend/favicon.ico" sizes="any" />
    <style>
      /* Static: GitHub Pages serves this for any missing path, so it carries its own look. */
      html {
        background: #001a46;
        color: #eef2ff;
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-image:
          linear-gradient(rgba(53, 198, 255, 0.14) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 198, 255, 0.14) 1px, transparent 1px),
          linear-gradient(rgba(53, 198, 255, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(53, 198, 255, 0.05) 1px, transparent 1px);
        background-size:
          160px 160px,
          160px 160px,
          32px 32px,
          32px 32px;
        background-position: -1px -1px;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      img {
        width: min(320px, 70vw);
        height: auto;
      }
      .mono {
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        color: #35c6ff;
        margin-top: 2.5rem;
      }
      p {
        color: #a7b6d9;
        margin: 0.75rem 0 0;
      }
      a {
        color: #35c6ff;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.8rem;
        text-decoration: none;
        display: inline-block;
        margin-top: 1.5rem;
      }
      a:hover,
      a:focus-visible {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/eBook-Metamend/lockup-480.png" alt="eBook Metamend" width="480" height="140" />
      <div class="mono">404 · no such sheet</div>
      <p>There is nothing drawn at this address.</p>
      <a href="/eBook-Metamend/">[ back to the tool ]</a>
    </main>
  </body>
</html>
